[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aurum-agent"
version = "0.1.0"
description = "Enterprise-grade personal finance and investment RAG agent"
readme = "project_introduction/README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "boto3>=1.35,<2",
    "celery[redis]>=5.4,<6",
    "dashscope>=1.23,<2",
    "email-validator>=2.2,<3",
    "fastapi>=0.115,<1",
    "openpyxl>=3.1,<4",
    "pgvector>=0.3.6,<1",
    "pwdlib[argon2]>=0.2.1,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6,<3",
    "PyJWT[crypto]>=2.10,<3",
    "python-multipart>=0.0.20,<1",
    "redis>=5.2,<7",
    "SQLAlchemy>=2.0.39,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.15,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "ruff>=0.11,<1",
    "types-openpyxl>=3.1,<4",
]

[project.scripts]
aurum-agent = "app.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".agents", ".git", ".idea"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"tests/integration/test_auth_cookies.py" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
