global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: aurum-api-blue
    metrics_path: /metrics
    static_configs:
      - targets: ["api-blue:8010"]
        labels:
          slot: blue

  - job_name: aurum-api-green
    metrics_path: /metrics
    static_configs:
      - targets: ["api-green:8010"]
        labels:
          slot: green

