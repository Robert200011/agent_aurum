name: aurum-agent

x-aurum-runtime-environment: &aurum-runtime-environment
  AURUM_ENVIRONMENT: development
  AURUM_DATABASE_URL: postgresql+asyncpg://aurum_app:${AURUM_APP_DB_PASSWORD:?请在 .env 中设置 AURUM_APP_DB_PASSWORD}@postgres:5432/aurum
  AURUM_MIGRATION_DATABASE_URL: postgresql+asyncpg://aurum:${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}@postgres:5432/aurum
  AURUM_APP_DATABASE_ROLE: aurum_app
  AURUM_LANGGRAPH_AES_KEY: ${AURUM_LANGGRAPH_AES_KEY:-}
  AURUM_REDIS_URL: redis://redis:6379/0
  AURUM_JWT_SECRET_KEY: ${AURUM_JWT_SECRET_KEY:?请在 .env 中设置 AURUM_JWT_SECRET_KEY}
  AURUM_CORS_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173"]'
  AURUM_DASHSCOPE_API_KEY: ${AURUM_DASHSCOPE_API_KEY:-}
  AURUM_CHAT_MODEL: ${AURUM_CHAT_MODEL:-qwen-plus}
  AURUM_CHAT_MODEL_BASE_URL: ${AURUM_CHAT_MODEL_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
  AURUM_CHAT_MODEL_TIMEOUT_SECONDS: "${AURUM_CHAT_MODEL_TIMEOUT_SECONDS:-60}"
  AURUM_CHAT_MODEL_MAX_TOKENS: "${AURUM_CHAT_MODEL_MAX_TOKENS:-2048}"
  AURUM_CHAT_MODEL_TEMPERATURE: "${AURUM_CHAT_MODEL_TEMPERATURE:-0.1}"
  AURUM_CHAT_MODEL_MAX_RETRIES: "${AURUM_CHAT_MODEL_MAX_RETRIES:-2}"
  AURUM_CAPABILITY_AGENT_MAX_STEPS: "${AURUM_CAPABILITY_AGENT_MAX_STEPS:-3}"
  AURUM_CAPABILITY_AGENT_MAX_TOOL_CALLS: "${AURUM_CAPABILITY_AGENT_MAX_TOOL_CALLS:-6}"
  AURUM_CAPABILITY_AGENT_HISTORY_MESSAGES: "${AURUM_CAPABILITY_AGENT_HISTORY_MESSAGES:-8}"
  AURUM_MEMORY_RETRIEVAL_MIN_SCORE: "${AURUM_MEMORY_RETRIEVAL_MIN_SCORE:-0.45}"
  AURUM_QUOTA_CHAT_USER_REQUESTS_PER_MINUTE: "${AURUM_QUOTA_CHAT_USER_REQUESTS_PER_MINUTE:-10}"
  AURUM_QUOTA_CHAT_GLOBAL_REQUESTS_PER_MINUTE: "${AURUM_QUOTA_CHAT_GLOBAL_REQUESTS_PER_MINUTE:-100}"
  AURUM_QUOTA_GLOBAL_MODEL_REQUESTS_PER_MINUTE: "${AURUM_QUOTA_GLOBAL_MODEL_REQUESTS_PER_MINUTE:-200}"
  AURUM_QUOTA_USER_DAILY_MODEL_TOKENS: "${AURUM_QUOTA_USER_DAILY_MODEL_TOKENS:-200000}"
  AURUM_QUOTA_GLOBAL_DAILY_MODEL_TOKENS: "${AURUM_QUOTA_GLOBAL_DAILY_MODEL_TOKENS:-2000000}"
  AURUM_QUOTA_USER_AGENT_CONCURRENCY: "${AURUM_QUOTA_USER_AGENT_CONCURRENCY:-2}"
  AURUM_QUOTA_GLOBAL_AGENT_CONCURRENCY: "${AURUM_QUOTA_GLOBAL_AGENT_CONCURRENCY:-20}"
  AURUM_QUOTA_MODEL_TOKENS_RESERVED_PER_REQUEST: "${AURUM_QUOTA_MODEL_TOKENS_RESERVED_PER_REQUEST:-8192}"
  AURUM_QUOTA_AGENT_LEASE_SECONDS: "${AURUM_QUOTA_AGENT_LEASE_SECONDS:-900}"
  AURUM_FINANCE_MARKET_STALE_AFTER_HOURS: "${AURUM_FINANCE_MARKET_STALE_AFTER_HOURS:-72}"
  AURUM_FINANCE_EXCHANGE_RATE_STALE_AFTER_HOURS: "${AURUM_FINANCE_EXCHANGE_RATE_STALE_AFTER_HOURS:-24}"
  AURUM_FINANCE_TIMEZONE: "${AURUM_FINANCE_TIMEZONE:-Asia/Shanghai}"
  AURUM_EMBEDDING_MODEL: ${AURUM_EMBEDDING_MODEL:-text-embedding-v4}
  AURUM_EMBEDDING_DIMENSIONS: "${AURUM_EMBEDDING_DIMENSIONS:-1024}"
  AURUM_EMBEDDING_REQUEST_TIMEOUT_SECONDS: "${AURUM_EMBEDDING_REQUEST_TIMEOUT_SECONDS:-30}"
  AURUM_EMBEDDING_BATCH_SIZE: "${AURUM_EMBEDDING_BATCH_SIZE:-16}"
  AURUM_METRICS_ENABLED: "${AURUM_METRICS_ENABLED:-true}"
  AURUM_OTEL_TRACING_ENABLED: "${AURUM_OTEL_TRACING_ENABLED:-false}"
  AURUM_OTEL_SERVICE_NAME: "${AURUM_OTEL_SERVICE_NAME:-aurum-agent}"
  AURUM_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "${AURUM_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}"
  AURUM_OTEL_EXPORT_TIMEOUT_SECONDS: "${AURUM_OTEL_EXPORT_TIMEOUT_SECONDS:-5}"

services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg16-trixie
    environment:
      POSTGRES_DB: aurum
      POSTGRES_USER: aurum
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      AURUM_APP_DB_PASSWORD: ${AURUM_APP_DB_PASSWORD:?请在 .env 中设置 AURUM_APP_DB_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - aurum-postgres-data:/var/lib/postgresql/data
      - ./scripts/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurum -d aurum"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - aurum-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
    entrypoint: []
    environment:
      <<: *aurum-runtime-environment
      AURUM_SERVER_HOST: 0.0.0.0
      AURUM_SERVER_PORT: "${AURUM_SERVER_PORT:-8010}"
    command:
      - /bin/sh
      - -c
      - alembic upgrade head && aurum-agent grant-app-role && aurum-agent serve
    ports:
      - "127.0.0.1:${AURUM_SERVER_PORT:-8010}:${AURUM_SERVER_PORT:-8010}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; port = os.environ['AURUM_SERVER_PORT']; urllib.request.urlopen(f'http://127.0.0.1:{port}/api/v1/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  aurum-postgres-data:
  aurum-redis-data:
